# Windows installers: npm run app:win → release/V3CT0R-Setup.exe and release/V3CT0R-Ecole.msi
# - V3CT0R-Setup.exe (the TÉLÉCHARGER button): one click, no administrator rights, installs for the
#   current user, puts V3CT0R on the desktop and in the Start menu, then opens it.
# - V3CT0R-Ecole.msi (schools, docs/DEPLOIEMENT.md): for every account of the PC (Program Files),
#   silent with msiexec /i V3CT0R-Ecole.msi /qn, deployable by GPO, Intune, PDQ; a newer MSI upgrades it.
# Uninstall from Windows settings (Applications). Signing: release.yml (Azure Trusted Signing, when set up).
appId: io.github.jul3zzz.v3ct0r
productName: V3CT0R
copyright: © 2026 V3CT0R
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - dist/**
  - "!dist/**/*.zip"
  - package.json
  # three and katex are already bundled into dist/index.html by Vite
  - "!node_modules/**"
asar: true
# the course voices are read by <audio>: kept as plain files next to the app
asarUnpack:
  - dist/courses/**
electronLanguages:
  - fr
  - en-US
compression: maximum
win:
  target:
    - target: nsis
      arch: x64
    - target: msi
      arch: x64
  icon: build/icon.ico
msi:
  oneClick: true
  perMachine: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: V3CT0R
  runAfterFinish: false
  artifactName: V3CT0R-Ecole.msi
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: V3CT0R
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: V3CT0R-Setup.exe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
